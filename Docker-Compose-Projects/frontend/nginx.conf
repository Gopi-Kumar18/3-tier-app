server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — React Router handles /student, /teacher etc.
    # client-side; without this, a direct hit or page refresh on those
    # paths 404s instead of serving index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
