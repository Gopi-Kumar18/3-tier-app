services:
  frontend:
    container_name: frontend
    build:
      context: frontend/
    image: frontend-image
    # Published on the App EC2's host network — the separate
    # Reverse-Proxy EC2 reaches this over the VPC (there's no shared
    # Docker network across EC2 instances). The real public-vs-private
    # boundary lives in AWS: the App EC2 has no public IP, and its
    # security group only allows inbound 8080/3500 from the
    # Reverse-Proxy EC2's security group — not from 0.0.0.0/0.
    ports:
      - "8080:8080"
    environment:
      # Resolved into env-config.js at container start — a relative
      # path, not a host:port, so the browser always calls whatever
      # origin served the page (the reverse-proxy EC2), which routes
      # /api/* on to the backend. Never bypassed directly.
      - API_BASE_URL=${API_BASE_URL}
    networks:
      - fe-net
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost — nginx's `listen 8080;` is IPv4-only,
      # and `localhost` can resolve to ::1 first, giving a false
      # "connection refused" unhealthy status.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    container_name: backend
    build:
      context: backend/
    image: backend-image
    # Published on the App EC2's host network for the same reason as
    # frontend above — restricted by AWS security group, not Docker
    # network membership.
    ports:
      - "3500:3500"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - be-net
      - db-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3500/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    container_name: mysql-container
    image: mysql:8.4
    # No ports published to the host — only the backend (sharing
    # db-net) can resolve/reach this service at all.
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - db-net
    restart: unless-stopped
    healthcheck:
      # CMD-SHELL (not exec-form CMD) so $$MYSQL_ROOT_PASSWORD is
      # actually expanded by a shell from the container's own env,
      # rather than passed to mysqladmin as a literal string.
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql-data:

networks:
  # One dedicated bridge network per tier. Docker only lets containers
  # reach each other if they share a network, so this is real
  # micro-segmentation even on a single EC2: frontend sits on fe-net
  # only (no path to backend or db via the Docker network — the
  # browser calls the API directly over the published host port, not
  # this container); backend bridges be-net (its own published host
  # port) and db-net (reaches db); db-net only ever has backend and db
  # on it, and db publishes no host port at all.
  fe-net:
    name: fe-net
    driver: bridge
  be-net:
    name: be-net
    driver: bridge
  db-net:
    name: db-net
    driver: bridge
